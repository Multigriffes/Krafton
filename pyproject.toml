[project]
name = "krafton"
version = "0.1.0"
description = "Moteur 3D OpenGL avec détection de marqueurs LED par vision par ordinateur"
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "numpy",
    "opencv-python",
    "pygame-ce",
    "PyOpenGL",
    "scikit-learn",
    "scipy",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
